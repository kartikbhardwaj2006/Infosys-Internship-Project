<div
  class="group relative bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 border-l-4 px-4 py-3.5 text-left cursor-grab active:cursor-grabbing hover:shadow-md hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-200"
  [ngClass]="[getPriorityBorderClasses(task().priority), task().dueDate && isOverdue(task().dueDate) ? 'ring-1 ring-red-100 dark:ring-red-500/30' : '']"
>
  <div class="flex items-start justify-between gap-2">
    <h3 class="font-semibold text-gray-900 dark:text-gray-200 text-sm leading-tight flex-1 min-w-0 pr-8">
      {{ task().title }}
    </h3>
    <!-- Quick actions: visible on hover only, top-right -->
    <div
      class="absolute top-3 right-3 flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200"
    >
      <button
        type="button"
        (click)="handleEdit()"
        class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-colors duration-200"
        aria-label="Edit task"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      </button>
      <button
        type="button"
        (click)="handleDelete($event)"
        class="p-1.5 rounded-lg text-gray-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition-colors duration-200"
        aria-label="Delete task"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>
  </div>
  @if (task().description) {
    <p class="text-gray-600 dark:text-gray-400 text-xs mt-2 line-clamp-2">{{ task().description }}</p>
  }
  <div class="flex flex-wrap items-center gap-2 mt-3">
    <span
      class="px-2 py-0.5 rounded-full text-xs font-medium"
      [class]="getPriorityClasses(task().priority)"
    >
      {{ task().priority }}
    </span>
    @if (task().dueDate) {
      <span class="text-xs text-gray-500 dark:text-gray-400">{{ formatDueDate(task().dueDate) }}</span>
      @if (isOverdue(task().dueDate)) {
        <span
          class="inline-flex items-center gap-1 rounded-full bg-red-50 dark:bg-red-900/40 text-red-700 dark:text-red-200 text-[10px] font-semibold uppercase tracking-wide px-2 py-0.5"
        >
          <span class="inline-block h-1.5 w-1.5 rounded-full bg-red-500"></span>
          Overdue
        </span>
      }
    }
  </div>
</div>
