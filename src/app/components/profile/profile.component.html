<div class="flex flex-col min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">

    <!-- Header -->
    <header
        class="sticky top-0 z-10 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-4 py-3">
        <div class="max-w-2xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-sm font-bold shadow">
                    FB
                </div>
                <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100">FlowBoard</h1>
            </div>

            <!-- Nav links -->
            <nav class="flex items-center gap-1">
                <a routerLink="/board"
                    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors duration-150">
                    Board
                </a>
                <a routerLink="/dashboard"
                    class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/60 transition-colors duration-150">
                    Dashboard
                </a>
                <a routerLink="/profile"
                    class="px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 transition-colors duration-150">
                    Profile
                </a>
            </nav>

            <div class="flex items-center gap-2">
                <button type="button" (click)="toggleTheme()"
                    class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200"
                    aria-label="Toggle theme">
                    @if (theme() === 'light') {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    }
                </button>
                <button type="button" (click)="logout()"
                    class="rounded-lg border border-gray-300 dark:border-gray-600 bg-white/80 dark:bg-gray-800 px-3 py-1.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-600 dark:hover:text-red-400 hover:border-red-300 dark:hover:border-red-800 transition-all duration-200">
                    Sign Out
                </button>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="flex-1 px-4 py-10 max-w-2xl mx-auto w-full">

        <!-- Avatar + title -->
        <div class="flex flex-col items-center gap-3 mb-8">
            <div
                class="w-20 h-20 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-3xl font-bold shadow-lg">
                {{ avatarInitial() }}
            </div>
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">Edit Profile</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">{{ email() }}</p>
            </div>
        </div>

        <!-- Form card -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm p-6">
            <div class="space-y-5">

                <!-- Name -->
                <div>
                    <label for="profile-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        Display Name
                    </label>
                    <input id="profile-name" type="text" [ngModel]="name()" (ngModelChange)="name.set($event)"
                        placeholder="Enter your name"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2.5 text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-shadow duration-200" />
                </div>

                <!-- Email (read-only) -->
                <div>
                    <label for="profile-email"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        Email <span class="text-xs text-gray-400 dark:text-gray-500 font-normal">(cannot be
                            changed)</span>
                    </label>
                    <input id="profile-email" type="email" [value]="email()" disabled
                        class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 px-4 py-2.5 text-sm text-gray-500 dark:text-gray-400 shadow-sm cursor-not-allowed" />
                </div>

                <!-- Bio -->
                <div>
                    <label for="profile-bio" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                        Bio <span class="text-xs text-gray-400 dark:text-gray-500 font-normal">(optional)</span>
                    </label>
                    <textarea id="profile-bio" [ngModel]="bio()" (ngModelChange)="bio.set($event)"
                        placeholder="A short description about yourself..." rows="3"
                        class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2.5 text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none resize-none transition-shadow duration-200"></textarea>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-2">
                    <button type="button" (click)="saveProfile()"
                        class="flex-1 rounded-xl bg-blue-600 hover:bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition-all duration-200">
                        Save Changes
                    </button>
                    <button type="button" (click)="cancel()"
                        class="rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition-all duration-200">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>
