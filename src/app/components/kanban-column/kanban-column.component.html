<div
  cdkDropList
  [id]="columnId()"
  [cdkDropListData]="tasks()"
  [cdkDropListConnectedTo]="connectedListIds()"
  (cdkDropListDropped)="dropped.emit($event)"
  class="rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-md min-h-[280px] h-full flex flex-col p-5 transition-shadow duration-200"
>
  <div class="flex items-center justify-between gap-3 pb-3 mb-3 border-b border-gray-100 dark:border-gray-700/80">
    <h2 class="font-semibold text-gray-900 dark:text-gray-100 text-sm tracking-tight truncate">
      {{ title() }}
      <span class="ml-1 text-xs font-normal text-gray-500 dark:text-gray-400">({{ tasks().length }})</span>
    </h2>
    <div class="flex items-center gap-1.5 shrink-0">
      <button
        type="button"
        (click)="downloadColumn.emit()"
        class="p-1.5 rounded-lg text-gray-400 dark:text-gray-500 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50/60 dark:hover:bg-blue-900/20 focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-colors duration-200"
        aria-label="Download tasks in column"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M16 12l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      </button>
      @if (canDelete()) {
        <button
          type="button"
          (click)="clearColumn.emit()"
          class="px-2 py-1 rounded-lg text-[11px] font-medium text-amber-700 dark:text-amber-300 bg-amber-50/80 dark:bg-amber-900/30 hover:bg-amber-100 dark:hover:bg-amber-900/50 focus:outline-none focus:ring-2 focus:ring-amber-500/40 transition-colors duration-200"
          aria-label="Clear all tasks in column"
        >
          Clear
        </button>
        <button
          type="button"
          (click)="deleteColumn.emit()"
          class="p-1.5 rounded-lg text-gray-400 dark:text-gray-500 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition-colors duration-200"
          aria-label="Delete column"
        >
          <span aria-hidden="true">✕</span>
        </button>
      }
    </div>
  </div>
  <div class="flex-1 space-y-3 overflow-y-auto pr-1 custom-column-scroll">
    @for (task of tasks(); track task.id) {
      <div cdkDrag [cdkDragData]="task" class="cdk-drag-handle">
        <app-task-card
          [task]="task"
          (onEdit)="editTask.emit($event)"
          (onDelete)="deleteTask.emit($event)"
        />
      </div>
    }
    @empty {
      <div class="flex flex-col items-center justify-center py-10 px-5 rounded-xl bg-gray-50/50 dark:bg-gray-800/50 border-2 border-dashed border-gray-200 dark:border-gray-700 min-h-[140px]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-300 dark:text-gray-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 10h16M4 14h16M4 18h7" />
        </svg>
        <p class="text-sm text-gray-500 dark:text-gray-400 text-center">
          No tasks yet. Drag one here.
        </p>
      </div>
    }
  </div>
  <ng-content />
</div>
