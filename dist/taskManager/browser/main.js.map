<div class="fixed top-6 right-4 z-[100] flex flex-col gap-2 max-w-sm">
  @for (msg of messages(); track msg.id) {
    <div
      class="rounded-xl border shadow-sm px-4 py-3 flex items-center justify-between gap-3 animate-in"
      [class]="getTypeClasses(msg)"
    >
      <span class="text-sm font-medium">{{ msg.message }}</span>
      <button
        type="button"
        (click)="dismiss(msg.id)"
        class="shrink-0 p-1 rounded-md opacity-70 hover:opacity-100"
        aria-label="Dismiss"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
